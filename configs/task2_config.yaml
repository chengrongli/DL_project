# Task 2 – Front-to-back reconstruction
# -----------------------------------------------
# Train with:
#   python train/train_task2.py --config configs/task2_config.yaml

data:
  train_dir:   "data/pairs/train"
  val_dir:     "data/pairs/val"
  image_size:  64
  occlusion_p: 0.3     # probability of applying random occlusion augmentation

model:
  # U-Net input = noisy back (3) + front condition (3) = 6 channels
  # U-Net output = back noise (3 channels)
  in_channels:      6
  out_channels:     3
  model_channels:   64
  channel_mults:    [1, 2, 4, 8]
  n_res_blocks:     2
  attn_resolutions: [8]
  time_emb_dim:     256
  dropout:          0.1

diffusion:
  timesteps:  1000
  schedule:   "cosine"
  loss_type:  "l2"
  ddim_steps: 50

training:
  device:           "cuda"
  epochs:           200
  batch_size:       64
  num_workers:      4
  lr:               2.0e-4
  lr_min:           1.0e-6
  weight_decay:     1.0e-4
  mixed_precision:  true

  # Discriminator fine-tuning (optional)
  # Enable after the diffusion model has converged to add sharpness.
  use_discriminator: false
  lr_disc:           1.0e-4
  lambda_adv:        0.01

  val_every:    5
  save_every:   10
  sample_every: 10

  out_dir: "outputs/task2"
