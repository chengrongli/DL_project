# Task 2 – Front-to-back reconstruction
# -----------------------------------------------
# Train with:
#   python train/train_task2.py --config configs/task2_config.yaml

data:
  train_dir:   "data/processed/task2/index_train.csv"
  val_dir:     "data/processed/task2/index_val.csv"
  image_size:  64
  occlusion_p: 0.3     # probability of applying random occlusion augmentation
  occlusion_intensity: 0.5  # [0,1] intensity scaling for occlusion size/fill
  occlusion_fill: "zero"  # one of: zero, noise, color
  # Optional: per-source sampling weights (list aligned with data_source list)
  # source_weights: [1.0, 0.5]
  # Optional separate OOD validation set directory or index file
  # ood_val_dir: "data/processed/task2/ood_index.csv"

model:
  # U-Net input = noisy back (3) + front condition (3) = 6 channels
  # U-Net output = back noise (3 channels)
  in_channels:      6
  out_channels:     3
  model_channels:   64
  channel_mults:    [1, 2, 4, 8]
  n_res_blocks:     2
  attn_resolutions: [8]
  time_emb_dim:     256
  dropout:          0.1

diffusion:
  timesteps:  1000
  schedule:   "cosine"
  loss_type:  "l2"
  ddim_steps: 50

training:
  device:           "cuda"
  epochs:           200
  batch_size:       64
  num_workers:      4
  lr:               2.0e-4
  lr_min:           1.0e-6
  weight_decay:     1.0e-4
  mixed_precision:  true

  # Classifier-Free Guidance training: randomly drop conditioning image
  cond_drop_prob: 0.05

  # EMA (exponential moving average) for model weights
  ema:
    enabled: true
    decay: 0.9999

  # Use dataset-provided sample weights (see data.source_weights)
  use_weighted_sampler: false

  # Discriminator fine-tuning (optional)
  # Enable after the diffusion model has converged to add sharpness.
  use_discriminator: false
  lr_disc:           1.0e-4
  lambda_adv:        0.01

  # Loss weighting
  fg_weight:     6.0    # foreground pixel weight
  bg_weight:     0.5    # background pixel weight
  color_weight:  1.0    # front-back color consistency weight

  val_every:    25
  save_every:   50
  sample_every: 50

  out_dir: "outputs/task2"
