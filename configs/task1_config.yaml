# Task 1 – Random front+back joint generation
# -----------------------------------------------
# Train with:
#   python train/train_task1.py --config configs/task1_config.yaml

data:
  # Path to pre-extracted front/back pair images OR a CSV index.
  # Run `python data/dataset.py` (or build_and_save_index) first to populate.
  # For rich palette diversity, default to the full LPC asset extraction.
  train_dir: "data/pairs/random_batch"
  # Validation defaults to the lightweight bundle for quick sanity checks.
  val_dir:   "data/pairs/random_batch"
  image_size: 64

model:
  # 数据布局：front+back 水平拼接成 (4, H, 2W)，包含 RGBA 4 通道
  in_channels:      4
  out_channels:     4
  model_channels:   64
  channel_mults:    [1, 2, 4, 8]
  n_res_blocks:     2
  attn_resolutions: [8, 16]          # apply attention at 8×8 / 16×16 (H 维度)
  time_emb_dim:     256
  cond_emb_dim:     256              # attribute embedding dim; set 0 to disable
  dropout:          0.1

diffusion:
  timesteps:  1000
  schedule:   "cosine"           # "linear" or "cosine"
  loss_type:  "l2"               # "l1" or "l2"
  ddim_steps: 50                 # steps used during inference

training:
  device:           "cuda"
  epochs:           2000           # DDPM 需要大量 iter 才能收敛，200 远远不够
  batch_size:       32            # 64x128 RGBA + U-Net 注意力下 128 容易 OOM 崩溃
  num_workers:      4
  lr:               1.0e-4
  lr_min:           1.0e-6
  # 在约 50 epoch 做大幅降学习率，抑制前景 loss 震荡。
  # 若不填 milestones，则退回 cosine 调度。
  lr_drop_milestones: [50, 120, 240]
  lr_drop_gamma:      0.2
  weight_decay:     1.0e-4
  warmup_steps:     3000           # 线性 warmup 步数，让训练初期更稳
  mixed_precision:  true           # AMP (requires CUDA); 若仍不稳可先设为 false
  ema_decay:        0.9999
  p_uncond:         0.1            # CFG null-drop probability during training (目前未使用)
  # 损失加权（用于 debug “loss 很低但图像乱码”）
  # - background_weight < 1 会降低背景占比
  # - foreground_weight > 1 会提升前景 RGB 梯度
  # - alpha_weight 可单独调 alpha 通道学习强度
  background_weight: 0.5
  foreground_weight: 8.0
  alpha_weight:      0.7

  # Evaluation / logging intervals (in epochs)
  val_every:    5
  save_every:   100
  sample_every: 50

  # 采样预览网格
  sample_count:   16
  sample_nrow:    4
  sample_upscale: 4

  # Output directory
  out_dir: "outputs/task1"
