<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Sprite Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Pixel Sprite Generator</h1>
            <p class="subtitle">Flow Matching &middot; LPC Character Synthesis</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-task2">正面 &rarr; 反面</button>
            <button class="tab-btn" data-tab="tab-flux">
                FLUX 角色生成
                <span class="badge">敬请期待</span>
            </button>
        </div>

        <!-- Tab 1: 正面 → 反面 -->
        <div id="tab-task2" class="tab-content active">
            <div class="card">
                <div class="upload-area" id="upload-area">
                    <div class="upload-content">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <p>拖拽正面图到此处，或<span class="link">点击上传</span></p>
                        <span class="hint">PNG / JPG &middot; 64&times;64 精灵图效果最佳</span>
                    </div>
                    <input type="file" id="front-upload" accept="image/*" hidden>
                    <img id="upload-preview" class="upload-preview hidden" alt="preview">
                </div>
                <button id="btn-task2" class="btn-primary" disabled>生成反面</button>
            </div>
            <div id="task2-result" class="result-area hidden">
                <div class="sprite-pair">
                    <div class="sprite-card">
                        <span class="sprite-label">正面 (输入)</span>
                        <div class="sprite-frame">
                            <img id="task2-front" class="sprite-img" alt="front">
                        </div>
                    </div>
                    <div class="arrow-wrap">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                    <div class="sprite-card">
                        <span class="sprite-label">反面 (生成)</span>
                        <div class="sprite-frame">
                            <img id="task2-back" class="sprite-img" alt="back">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: FLUX 角色生成 (预留) -->
        <div id="tab-flux" class="tab-content">
            <div class="card flux-placeholder">
                <div class="placeholder-content">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <h3>FLUX 角色生成</h3>
                    <p>使用 FLUX.1-dev 从文字描述生成正反面角色精灵</p>
                    <p class="hint">需要 24GB+ 显存，功能开发中</p>
                </div>
                <div class="flux-form disabled">
                    <div class="form-row">
                        <div class="form-group">
                            <label>角色类型</label>
                            <select id="char-type" disabled>
                                <option value="warrior knight in heavy armor">&#9876; 战士</option>
                                <option value="mage wizard with magic staff">&#9733; 法师</option>
                                <option value="ranger archer with bow">&#127991; 游侠</option>
                                <option value="rogue thief with daggers">&#128484; 盗贼</option>
                                <option value="cleric healer in white robes">&#10013; 牧师</option>
                                <option value="barbarian with greataxe">&#128170; 野蛮人</option>
                                <option value="necromancer with skull staff">&#9760; 死灵法师</option>
                                <option value="paladin in golden armor">&#127775; 圣骑士</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:2">
                            <label>补充描述</label>
                            <input type="text" id="char-desc" disabled placeholder="red hair, female, elf ears...">
                        </div>
                    </div>
                    <button id="btn-flux" class="btn-primary" disabled>生成角色</button>
                </div>
            </div>
            <div id="flux-result" class="result-area hidden">
                <div class="sprite-pair">
                    <div class="sprite-card">
                        <span class="sprite-label">Front</span>
                        <div class="sprite-frame"><img id="flux-front" class="sprite-img" alt="front"></div>
                    </div>
                    <div class="arrow-wrap">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                    <div class="sprite-card">
                        <span class="sprite-label">Back</span>
                        <div class="sprite-frame"><img id="flux-back" class="sprite-img" alt="back"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>生成中...</p>
        </div>

        <div id="error" class="error-bar hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
